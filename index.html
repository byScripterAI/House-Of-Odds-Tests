<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050304">
  <meta name="description" content="HOUSE OF ODDS — a 3D casino arcade adventure.">
  <title>HOUSE OF ODDS</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preload" as="image" href="assets/ui/keyart.webp" type="image/webp">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/menus.css">
  <link rel="stylesheet" href="styles/hud.css">
  <link rel="stylesheet" href="styles/story.css">
  <link rel="stylesheet" href="styles/ui.css">

  <!-- Three.js se sirve desde /vendor (sin CDN): el juego funciona sin conexión. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas" tabindex="-1"></canvas>
  <div id="ui-root"></div>

  <div id="boot-screen" class="boot" role="status" aria-live="polite">
    <div class="boot__art" aria-hidden="true"></div>
    <div class="boot__shade" aria-hidden="true"></div>
    <div class="boot__grain" aria-hidden="true"></div>
    <div class="boot__brand">
      <div class="boot__kicker">VANTA INTERACTIVE</div>
      <h1 class="boot__logo">HOUSE<i>OF</i><b>ODDS<span class="boot__beta">BETA</span></b></h1>
      <p id="boot-tagline" class="boot__tagline"></p>
    </div>
    <div class="boot__bottom">
      <div class="boot__tipbox" aria-hidden="true">
        <span id="boot-tiplabel" class="boot__tiplabel">TIP</span>
        <p id="boot-tip" class="boot__tip"></p>
      </div>
      <div class="boot__status">
        <p id="boot-message" class="boot__message">Loading…</p>
        <span id="boot-pct" class="boot__pct">0<small>%</small></span>
        <svg class="boot__chip" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/><g stroke="currentColor" stroke-width="3.2" stroke-linecap="butt"><path d="M16 1.5v4.2M16 26.3v4.2M1.5 16h4.2M26.3 16h4.2M5.75 5.75l3 3M23.25 23.25l3 3M26.25 5.75l-3 3M8.75 23.25l-3 3"/></g><path d="M16 11.5l3 4.5-3 4.5-3-4.5z" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="boot__bar" aria-hidden="true"><div id="boot-fill" class="boot__fill"></div><div id="boot-head" class="boot__head"></div></div>
    <span id="boot-version" class="boot__version" aria-hidden="true">v0.6.4 · BETA</span>
  </div>

  <noscript>
    <div class="noscript">
      HOUSE OF ODDS needs JavaScript to be enabled.<br>
      HOUSE OF ODDS necesita JavaScript activado.<br>
      HOUSE OF ODDS benötigt aktiviertes JavaScript.<br>
      HOUSE OF ODDS nécessite JavaScript.<br>
      O HOUSE OF ODDS precisa de JavaScript ativado.<br>
      HOUSE OF ODDS 需要启用 JavaScript。
    </div>
  </noscript>

  <!-- Guardia de arranque (script clásico, independiente de los módulos):
       si los módulos no llegan a ejecutarse, explica por qué en vez de quedarse en «Loading…».
       Usa el mismo idioma que el juego (el guardado, o el del navegador; inglés si no es uno de los 6). -->
  <script>
    (function () {
      var T = {
        en: ['Loading…', 'This game needs a local server. Run "node server.mjs" and open http://127.0.0.1:8080', 'The game could not be loaded. Is the server running? Check the console (F12).', 'The game is taking too long to start. Check the console (F12) and use a modern browser.'],
        es: ['Cargando…', 'Este juego necesita un servidor local. Ejecuta «node server.mjs» y abre http://127.0.0.1:8080', 'No se pudo cargar el juego. ¿Está activo el servidor? Revisa la consola (F12).', 'El juego tarda demasiado en iniciar. Revisa la consola (F12) y usa un navegador moderno.'],
        de: ['Wird geladen …', 'Dieses Spiel benötigt einen lokalen Server. Führe „node server.mjs“ aus und öffne http://127.0.0.1:8080', 'Das Spiel konnte nicht geladen werden. Läuft der Server? Prüfe die Konsole (F12).', 'Das Spiel startet zu langsam. Prüfe die Konsole (F12) und nutze einen modernen Browser.'],
        fr: ['Chargement…', 'Ce jeu nécessite un serveur local. Exécutez « node server.mjs » et ouvrez http://127.0.0.1:8080', 'Le jeu n’a pas pu être chargé. Le serveur est-il actif ? Consultez la console (F12).', 'Le jeu met trop de temps à démarrer. Consultez la console (F12) et utilisez un navigateur récent.'],
        pt: ['A carregar…', 'Este jogo precisa de um servidor local. Executa «node server.mjs» e abre http://127.0.0.1:8080', 'Não foi possível carregar o jogo. O servidor está ativo? Consulta a consola (F12).', 'O jogo demora demasiado a iniciar. Consulta a consola (F12) e usa um navegador moderno.'],
        zh: ['加载中…', '此游戏需要本地服务器。请运行 “node server.mjs” 并打开 http://127.0.0.1:8080', '游戏无法加载。服务器是否已启动？请查看控制台（F12）。', '游戏启动时间过长。请查看控制台（F12），并使用现代浏览器。']
      };
      var lang = 'en';
      try {
        var saved = localStorage.getItem('houseofodds.language');
        var base = (saved || (navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase().split(/[-_]/)[0];
        if (T[base]) lang = base;
      } catch (e) {
        var b0 = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase().split(/[-_]/)[0];
        if (T[b0]) lang = b0;
      }
      var msg = T[lang];
      var boot = document.getElementById('boot-message');
      if (boot) boot.textContent = msg[0];
      document.documentElement.lang = lang;
      function fail(message) {
        if (window.__HOO_BOOTED || window.__HOO_FATAL) return;
        if (message === msg[3] && window.__HOO_LOADING) return; // los módulos ya arrancaron: está cargando recursos
        var el = document.getElementById('boot-message');
        if (!el) return;
        el.textContent = message;
        el.classList.add('boot__message--error');
      }
      if (location.protocol === 'file:') {
        fail(msg[1]);
        return;
      }
      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName === 'SCRIPT') fail(msg[2]);
      }, true);
      setTimeout(function () { fail(msg[3]); }, 10000);
    })();
  </script>

  <script type="module" src="src/main.js"></script>
</body>
</html>
